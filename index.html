<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dongchaylichsu</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <button id="discover-now-btn"> Khám phá ngay ></button>
    <div id="bg">
        <img src="images/bg.jpg">
    </div>
    <div id="book-intro">
        <div class="page" id="page-cover">
            <div class="front" id="cover">
                <div class="resize-cover">
                    <img src="images/bia1.png">
                    <div class="book-name">Dòng Chảy Lịch Sử</div>
                    <div class="floating fade">
                        <img src="images/lachong.png">
                    </div>

                    <div class="floating2 fade">
                        <img src="images/lachong.png">
                    </div>
                </div>

            </div>
            <div class="back"></div>
        </div>

        <div class="page" id="page-two">
            <div class="front"></div>
            <div class="back"></div>
        </div>
        <div id="intro-text">
            <div class="i1">Chào Mừng Bạn Đến Với Dòng Chảy Lịch Sử Nơi dòng thời gian trôi đi nhưng còn mãi những chiến công anh hùng ở lại </div>
        </div>
        <div id="bookLight"></div>
    </div>

    
    
    <main id="main-contents">
        <div class="main-bg">
            <img src="images/mainbg-.jpg">
        </div>
        <div class="introduction">LỜI NÓI ĐẦU</div>
        <div class="intro-main">Hihj</div>
            
        

        
        <div class="action-menu">
            <button>
                <div class="three-lines">
                    <span class="line"></span>
                    <span class="line"></span>
                    <span class="line"></span>
                </div>
            </button>

            <div class="action-menu-btns">
                <div class="btn" data-target="tran-hung-dao">
                    <span>Trần Hưng Đạo</span>
                    <button>
                        <img src="images/conhatran.jpg" alt="Cờ nhà Trần">
                    </button>
                </div>

                <div class="btn" data-target="dinh-bo-linh">
                    <span>Đinh Bộ Lĩnh</span>
                    <button>
                        <img src="images/conhadinh.jpg" alt="Cờ nhà Đinh">
                    </button>
                </div>

                <div class="btn" data-target="quang-trung">
                    <span>Quang Trung</span>
                    <button>
                        <img src="images/cothoinguyen.jpg" alt="Cờ Tây Sơn">
                    </button>
                </div>

                <div class="btn" data-target="ngo-quyen">
                    <span>Ngô Quyền</span>
                    <button>
                        <img src="images/conhango.jpg" alt="Cờ nhà Ngô">
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
